<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-label="Scales of justice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1F2839"/>
      <stop offset="1" stop-color="#1F2839"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ead2a8"/>
      <stop offset="0.55" stop-color="#cfae7c"/>
      <stop offset="1" stop-color="#a1804f"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c89a"/>
      <stop offset="1" stop-color="#9c7a4c"/>
    </linearGradient>
  </defs>

  <rect width="520" height="640" fill="url(#bg)"/>
  <circle cx="260" cy="230" r="230" fill="url(#glow)"/>

  <!-- Faint columns -->
  <g fill="#ffffff" opacity="0.05">
    <rect x="28" y="120" width="44" height="520"/>
    <rect x="20" y="104" width="60" height="18" rx="3"/>
    <rect x="448" y="120" width="44" height="520"/>
    <rect x="440" y="104" width="60" height="18" rx="3"/>
  </g>

  <!-- Floor shadow -->
  <ellipse cx="260" cy="560" rx="150" ry="16" fill="#000000" opacity="0.3"/>

  <!-- Base -->
  <path d="M190 548 L330 548 L312 520 L208 520 Z" fill="url(#metal)"/>
  <rect x="226" y="504" width="68" height="18" rx="6" fill="#c4a372"/>

  <!-- Pillar -->
  <rect x="252" y="176" width="16" height="332" rx="8" fill="url(#metal)"/>
  <circle cx="260" cy="164" r="18" fill="url(#metal)"/>
  <circle cx="260" cy="164" r="7" fill="#1F2839"/>

  <!-- Beam (tilted: left side heavier) -->
  <g transform="rotate(-6 260 200)">
    <rect x="96" y="194" width="328" height="12" rx="6" fill="url(#metal)"/>
    <circle cx="100" cy="200" r="9" fill="#c4a372"/>
    <circle cx="420" cy="200" r="9" fill="#c4a372"/>
  </g>

  <!-- Left pan (lower) with case files -->
  <g stroke="#cfae7c" stroke-width="2.5" opacity="0.95">
    <line x1="101" y1="217" x2="46" y2="384"/>
    <line x1="101" y1="217" x2="156" y2="384"/>
  </g>
  <g>
    <rect x="62" y="342" width="72" height="12" rx="2" fill="#ffffff" transform="rotate(-4 98 348)"/>
    <rect x="58" y="354" width="80" height="13" rx="2" fill="#efe4d2"/>
    <rect x="64" y="367" width="70" height="12" rx="2" fill="#ffffff" transform="rotate(3 99 373)"/>
    <path d="M36 382 L166 382 Q160 418 101 420 Q42 418 36 382 Z" fill="url(#pan)"/>
    <ellipse cx="101" cy="382" rx="65" ry="6" fill="#f0dcb8"/>
  </g>

  <!-- Right pan (higher) with a single page -->
  <g stroke="#cfae7c" stroke-width="2.5" opacity="0.95">
    <line x1="419" y1="183" x2="364" y2="330"/>
    <line x1="419" y1="183" x2="474" y2="330"/>
  </g>
  <g>
    <rect x="392" y="308" width="54" height="18" rx="2" fill="#ffffff" transform="rotate(-8 419 317)"/>
    <path d="M354 328 L484 328 Q478 364 419 366 Q360 364 354 328 Z" fill="url(#pan)"/>
    <ellipse cx="419" cy="328" rx="65" ry="6" fill="#f0dcb8"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M196 92 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" opacity="0.9"/>
    <path d="M348 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.7"/>
    <path d="M380 460 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z" opacity="0.6"/>
  </g>
</svg>
